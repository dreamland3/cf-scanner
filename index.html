<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اسکنر زنده کلودفلر</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg:#1c1c1e; --card:#2c2c2e; --row:#3a3a3c; --row-h:#48484a;
          --txt:#fff; --muted:#aeaeb2; --green:#30d158; --red:#ff453a; --blue:#0a84ff; --amber:#ffd60a; }
  * { box-sizing:border-box; }
  body { font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg);
         color:var(--txt); margin:0; padding:14px; }
  .container { max-width:420px; margin:0 auto; background:var(--card); padding:16px; border-radius:14px; }
  h2 { margin:0 0 6px; font-size:19px; color:var(--green); text-align:center; }
  p.hint { color:var(--muted); font-size:12.5px; line-height:1.6; margin:0 0 12px; text-align:center; }
  .row { display:flex; gap:8px; }
  select, button { font-family:inherit; }
  select { flex:0 0 34%; padding:11px 8px; font-size:14px; border-radius:9px; border:1px solid #48484a;
           background:#3a3a3c; color:var(--txt); }
  button { border:none; border-radius:9px; font-size:14.5px; font-weight:600; padding:11px; cursor:pointer; }
  #scanBtn { flex:1; background:var(--green); color:#000; }
  #scanBtn:disabled { background:#48484a; color:#8e8e93; cursor:default; }
  #stopBtn { flex:1; background:var(--red); color:#fff; display:none; }
  #copyAllBtn { width:100%; background:var(--blue); color:#fff; margin-top:10px; display:none; }
  #status { margin-top:12px; color:var(--amber); font-size:13.5px; text-align:center; min-height:18px; }
  #meta { margin-top:4px; color:var(--muted); font-size:12px; text-align:center; }
  .result-item { background:var(--row); padding:11px 13px; margin:7px 0; border-radius:8px; display:flex;
                 justify-content:space-between; align-items:center; font-family:ui-monospace,monospace;
                 font-size:14px; cursor:pointer; }
  .result-item:hover { background:var(--row-h); }
  .latency { color:var(--amber); font-weight:700; }
  .copy-hint { font-size:11.5px; color:#8e8e93; text-align:center; margin-top:8px; display:none; }
</style>
</head>
<body>
<div class="container">
  <h2>اسکنر زنده کلودفلر</h2>
  <p class="hint">فیلترشکن کل دستگاه را خاموش کن و فقط با پروکسی داخلی تلگرام (MTProto) وصل شو.
     اسکن از روی گوشی خودت انجام می‌شود، نه از سرور.</p>

  <div class="row">
    <button id="scanBtn">شروع اسکن</button>
    <button id="stopBtn">توقف</button>
    <select id="portSel" title="پورت">
      <option value="443" selected>پورت 443</option>
      <option value="2053">پورت 2053</option>
      <option value="8443">پورت 8443</option>
      <option value="80">پورت 80</option>
    </select>
  </div>

  <div id="status"></div>
  <div id="meta"></div>

  <button id="copyAllBtn">کپی همهٔ آی‌پی‌ها</button>
  <div class="copy-hint" id="copyHint">برای کپی تکی، روی هر آی‌پی ضربه بزن.</div>
  <div id="results"></div>
</div>

<script>
  // شیم امن: بیرون از تلگرام (یا در مرورگر معمولی) هم کار کند
  const tg = (window.Telegram && window.Telegram.WebApp) || {
    ready(){}, expand(){}, close(){},
    showPopup(o){ if (o && o.message) alert(o.title ? o.title + "\n\n" + o.message : o.message); },
    HapticFeedback: { impactOccurred(){} }
  };
  tg.ready(); tg.expand();

  // نمونهٔ آی‌پی از رنج‌های کلودفلر؛ اسکن موازی آن‌ها را غربال می‌کند
  const ipPool = [
    "172.67.0.1","104.16.0.1","104.24.0.1","162.159.0.1","198.41.128.1",
    "141.101.64.1","190.93.240.1","188.114.96.1","172.67.10.2","104.17.5.4",
    "104.20.10.1","162.159.10.5","198.41.130.10","141.101.65.20","188.114.97.5",
    "104.17.141.179","172.67.242.89","104.19.156.170","103.21.244.1","108.162.192.1",
    "172.64.0.1","104.18.0.1","104.27.0.1","190.93.244.1"
  ];

  const CONCURRENCY = 6;      // چند تست هم‌زمان
  const TIMEOUT_MS = 900;     // سقف انتظار هر تست
  const MAX_LATENCY = 600;    // بالاتر از این، آی‌پی «تمیز» حساب نمی‌شود
  const STORE_KEY = "cfscan:last";

  let found = new Map();      // ip -> latency
  let isScanning = false;
  let controllers = new Set();

  const $ = id => document.getElementById(id);

  function probe(ip, port) {
    return new Promise(resolve => {
      const t0 = performance.now();
      const ctrl = new AbortController();
      controllers.add(ctrl);
      const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
      fetch(`https://${ip}:${port}/?_=${t0}`, { mode:"no-cors", cache:"no-store", signal: ctrl.signal })
        .then(() => { clearTimeout(timer); resolve(Math.round(performance.now() - t0)); })
        .catch(() => {
          clearTimeout(timer);
          const dt = performance.now() - t0;
          // خطای TLS/شبکه هم برای ما یک RTT واقعی است؛ فقط خطای فوری (زیر ۱۵ms) رد می‌شود
          resolve(dt >= 15 && dt < TIMEOUT_MS ? Math.round(dt) : null);
        })
        .finally(() => controllers.delete(ctrl));
    });
  }

  // دو بار تست، کم‌ترین زمان؛ نتیجه پایدارتر از یک بار
  async function probeBest(ip, port) {
    const a = await probe(ip, port);
    if (a === null) return null;
    const b = await probe(ip, port);
    return b === null ? a : Math.min(a, b);
  }

  async function scan(port) {
    isScanning = true;
    found = new Map();
    render();
    const total = ipPool.length;
    let done = 0;
    const startedAt = performance.now();
    const tick = () => {
      $("status").textContent = `در حال تست ${done}/${total} آی‌پی...`;
      $("meta").textContent = `${found.size} آی‌پی سالم تا این لحظه`;
    };
    tick();

    let idx = 0;
    async function worker() {
      while (isScanning && idx < total) {
        const ip = ipPool[idx++];
        const ms = await probeBest(ip, port);
        done++;
        if (ms !== null && ms <= MAX_LATENCY) found.set(ip, ms);
        tick();
        render();
      }
    }
    await Promise.all(Array.from({ length: Math.min(CONCURRENCY, total) }, worker));
    finish(startedAt);
  }

  function finish(startedAt) {
    isScanning = false;
    controllers.forEach(c => { try { c.abort(); } catch (e) {} });
    controllers.clear();
    toggleButtons();
    const seconds = ((performance.now() - startedAt) / 1000).toFixed(1);
    if (found.size > 0) {
      $("status").textContent = `${found.size} آی‌پی سالم پیدا شد — ${seconds} ثانیه`;
      const best = Math.min(...found.values());
      $("meta").textContent = `سریع‌ترین: ${best} میلی‌ثانیه`;
      $("copyAllBtn").style.display = "block";
      $("copyHint").style.display = "block";
      try { localStorage.setItem(STORE_KEY, JSON.stringify([...found])); } catch (e) {}
    } else {
      $("status").textContent = "هیچ آی‌پی سالمی پیدا نشد.";
      $("meta").textContent = "پورت دیگری را امتحان کن یا اسکن را دوباره بزن.";
    }
  }

  function toggleButtons() {
    $("scanBtn").disabled = isScanning;
    $("stopBtn").style.display = isScanning ? "block" : "none";
  }

  function render() {
    const box = $("results");
    box.innerHTML = "";
    [...found.entries()].sort((a, b) => a[1] - b[1]).forEach(([ip, ms]) => {
      const div = document.createElement("div");
      div.className = "result-item";
      div.onclick = () => copyOne(ip);
      const left = document.createElement("span"); left.textContent = ip;
      const right = document.createElement("span"); right.className = "latency"; right.textContent = ms + "ms";
      div.appendChild(left); div.appendChild(right);
      box.appendChild(div);
    });
  }

  function copyOne(ip) {
    navigator.clipboard.writeText(ip).then(() => {
      tg.showPopup({ title:"کپی شد", message:`آی‌پی ${ip} کپی شد.` });
      tg.HapticFeedback.impactOccurred();
    });
  }

  function copyAll() {
    if (found.size === 0) return;
    const text = [...found.entries()].sort((a, b) => a[1] - b[1]).map(e => e[0]).join("\n");
    navigator.clipboard.writeText(text).then(() => {
      tg.showPopup({ title:"کپی شد", message:`${found.size} آی‌پی کپی شد.` });
      tg.HapticFeedback.impactOccurred();
    });
  }

  $("scanBtn").onclick = () => {
    if (isScanning) return;
    toggleButtons();
    scan($("portSel").value);
  };
  $("stopBtn").onclick = () => {
    isScanning = false;
    controllers.forEach(c => { try { c.abort(); } catch (e) {} });
    controllers.clear();
    $("status").textContent = "اسکن متوقف شد.";
    toggleButtons();
  };
  $("copyAllBtn").onclick = copyAll;

  // آخرین نتیجه را نگه می‌دارد تا با بستن و باز کردن مینی‌اپ از دست نرود
  (function restore() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "[]");
      if (saved.length) {
        found = new Map(saved);
        render();
        $("status").textContent = "نتیجهٔ اسکن قبلی (برای نتیجه تازه دوباره اسکن کن).";
        $("copyAllBtn").style.display = "block";
        $("copyHint").style.display = "block";
      }
    } catch (e) {}
  })();
</script>
</body>
</html>
